<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Georbit Form Inbox</title>
  <style>
    body{font:16px system-ui;background:#0b0b0b;color:#f5f5f5;margin:0;padding:30px}
    main{max-width:900px;margin:auto}input,button{font:inherit;padding:12px;border-radius:8px}
    input{width:65%;background:#171717;color:white}button{background:#e32227;color:white;border:0;cursor:pointer}
    article{background:#141414;border:1px solid #444;border-radius:12px;padding:18px;margin:14px 0}
    dt{color:#aaa;margin-top:10px}dd{margin:2px 0;white-space:pre-wrap;overflow-wrap:anywhere}
    time{color:#aaa}@media(max-width:600px){input{width:90%}}
  </style>
</head>
<body>
  <main>
    <h1>Form submissions</h1>
    <p>Enter the private inbox token configured in Cloudflare Pages.</p>
    <form id="login"><input id="token" type="password" placeholder="Inbox access token" required><button>Open inbox</button></form>
    <p id="status" role="status"></p><section id="items"></section>
  </main>
  <script>
    const form=document.querySelector("#login"),token=document.querySelector("#token"),status=document.querySelector("#status"),items=document.querySelector("#items");
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    token.value=sessionStorage.getItem("georbit-inbox-token")||"";
    form.addEventListener("submit",async e=>{e.preventDefault();status.textContent="Loading…";items.replaceChildren();try{
      const r=await fetch("/api/forms?limit=100",{headers:{authorization:"Bearer "+token.value}}),d=await r.json();
      if(!r.ok||!d.ok)throw Error(d.error||"Could not open inbox.");
      sessionStorage.setItem("georbit-inbox-token",token.value);status.textContent=d.submissions.length+" latest submission(s)";
      for(const x of d.submissions){const fields=JSON.parse(x.fields_json);delete fields.website;const card=document.createElement("article");
        card.innerHTML="<h2>"+esc(x.form_type)+" — "+esc(x.submitter_email)+"</h2><time>"+esc(x.created_at)+"</time><dl>"+
          Object.entries(fields).map(([k,v])=>"<dt>"+esc(k.replace(/_/g," "))+"</dt><dd>"+esc(v)+"</dd>").join("")+"</dl>";items.append(card);}
    }catch(error){sessionStorage.removeItem("georbit-inbox-token");status.textContent=error.message;}});
    if(token.value)form.requestSubmit();
  </script>
</body>
</html>
